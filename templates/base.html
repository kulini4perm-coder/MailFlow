{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MailFlow{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body>
    <header class="p-3 bg-dark text-white mb-4">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-between">
                <a href="/" class="fs-4 text-white text-decoration-none fw-bold">MailFlow</a>
                <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0 ms-4">
                    <li><a href="{% url 'clients:list' %}" class="nav-link px-2 text-white fw-semibold">Клиенты</a></li>
                    <li><a href="#" class="nav-link px-2 text-secondary">Рассылки</a></li>
                    <li><a href="#" class="nav-link px-2 text-secondary">Сообщения</a></li>
                </ul>
            </div>
        </div>
    </header>

    <main class="container py-4" style="min-height: 70vh;">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="pt-4 my-md-5 pt-md-5 border-top container">
        <div class="row">
            <div class="col-12 col-md">
                <strong>MailFlow</strong>
                <small class="d-block mb-3 text-muted">&copy; 2026</small>
            </div>
            <div class="col-6 col-md">
                <h5>Разделы</h5>
                <ul class="list-unstyled text-small">
                    <li><a href="{% url 'clients:list' %}" class="text-muted">Клиенты</a></li>
                    <li><a class="text-muted" href="#">Рассылки</a></li>
                </ul>
            </div>
            <div class="col-6 col-md">
                <h5>Поддержка</h5>
                <ul class="list-unstyled text-small">
                    <li><a class="text-muted" href="#">Документация</a></li>
                    <li><a class="text-muted" href="#">Помощь</a></li>
                </ul>
            </div>
        </div>
    </footer>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
