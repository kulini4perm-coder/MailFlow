{% extends 'base.html' %}
{% block title %}Регистрация - MailFlow{% endblock %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 450px;">
    <div class="card-header bg-success text-white"><h4 class="mb-0">Регистрация</h4></div>
    <div class="card-body">
        <!-- Добавили enctype для корректной загрузки картинок аватара -->
        <form method="post" enctype="multipart/form-data" novalidate>
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}
                        <div class="form-text text-muted small">{{ field.help_text }}</div>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-success w-100 mt-3">Зарегистрироваться</button>
        </form>
    </div>
</div>
<script>
    // Стилизуем все поля ввода, кроме файлов (аватара)
    document.querySelectorAll('input').forEach(el => {
        if (el.type !== 'file') {
            el.classList.add('form-control');
        }
    });
</script>
{% endblock %}
