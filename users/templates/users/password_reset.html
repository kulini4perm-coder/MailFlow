{% extends 'base.html' %}
{% block title %}Восстановление пароля - MailFlow{% endblock %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 450px;">
    <div class="card-header bg-warning text-dark"><h4 class="mb-0">Восстановление пароля</h4></div>
    <div class="card-body">
        <p class="text-muted small">Введите ваш email, и система сгенерирует новый случайный пароль для входа.</p>
        <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold">Ваш Email</label>
                <input type="email" name="email" class="form-control" placeholder="example@mail.ru" required>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-4">
                <a href="{% url 'users:login' %}" class="small text-decoration-none">Назад ко входу</a>
                <button type="submit" class="btn btn-warning">Сгенерировать пароль</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
