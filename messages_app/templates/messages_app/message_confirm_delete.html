{% extends 'base.html' %}

{% block title %}Удаление сообщения - MailFlow{% endblock %}

{% block content %}
<div class="card shadow-sm border-danger mx-auto text-center" style="max-width: 500px;">
    <div class="card-body py-4">
        <div class="text-danger display-4 mb-3">⚠️</div>
        <h4>Удалить сообщение?</h4>
        <p class="text-muted">Вы уверены, что хотите безвозвратно удалить шаблон <strong>«{{ object.subject }}»</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-2 mt-4">
                <a href="{% url 'messages_app:list' %}" class="btn btn-secondary">Отмена</a>
                <button type="submit" class="btn btn-danger">Да, удалить</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
